name: Harvest Scroll Logger

on:
  push:
    paths:
      - "data/reddit_*.csv"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-harvest-scroll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas
      - run: python scripts/harvest_logger.py
      - name: Commit if needed
        run: |
          git config user.name "MimicVerse Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/HarvestScroll.csv
          git commit -m "chore: HarvestScroll" || echo "no scroll change"
          git push || true